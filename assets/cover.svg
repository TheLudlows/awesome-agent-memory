    <linearGradient id="edge"><stop stop-color="#60e0bf" stop-opacity=".7"/><stop offset="1" stop-color="#739cf5" stop-opacity=".2"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#49b4b2" stop-opacity=".15"/><stop offset="1" stop-color="#49b4b2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c6d4ee" opacity=".09"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="20" fill="url(#bg)"/>
