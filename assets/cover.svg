<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Agent Memory</title>
  <desc id="desc">A research reading room for agent memory, retrieval, and learning.</desc>
  <defs>
