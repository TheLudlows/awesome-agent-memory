  <text x="65" y="164" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.7" fill="#f4f7fc">Awesome</text>
  <text x="65" y="230" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.7" fill="#f4f7fc">Agent Memory</text>
  <text x="68" y="283" font-family="Arial, sans-serif" font-size="19" fill="#b4c3d9">Understand the papers. Examine the evidence. Form a view.</text>
  <line x1="68" y1="326" x2="738" y2="326" stroke="#28384f"/>
  <text x="68" y="370" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.7" fill="#d5e1f0">34 PAPERS</text>
  <text x="232" y="370" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.7" fill="#d5e1f0">10 READING PATHS</text>
  <text x="461" y="370" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.7" fill="#d5e1f0">CHINESE DEEP DIVES</text>
